<!DOCTYPE html>
<html>
<head>
    <title>👑 Admin Panel - Telegram Manager</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: auto; }
        .account { border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .chat { border: 1px solid #ddd; margin: 10px 0; padding: 10px; cursor: pointer; }
        .msg { margin: 5px 0; padding: 8px; background: #fff; border-radius: 5px; }
        .you { background: #dcf8c6; text-align: right; }
        .them { background: #ffffff; }
        #chatView { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👑 Telegram Account Manager (Admin)</h1>
        <div id="accountList"></div>
        <div id="chatList" style="display:none;">
            <button id="backToAccounts">⬅️ Back to Accounts</button>
            <h3>Chats for <span id="currentPhone"></span></h3>
            <div id="chatsContainer"></div>
        </div>
        <div id="chatView">
            <button id="backToChats">⬅️ Back to Chats</button>
            <h3>Chat with: <span id="chatTitle"></span></h3>
            <div id="messages"></div>
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const SECRET_KEY = "your_admin_key_here"; // ⚠️ Change this!
        let currentUserId = null;

        // Load Accounts
        async function loadAccounts() {
            const res = await fetch(`/api/accounts?key=${SECRET_KEY}`);
            const accounts = await res.json();
            const container = document.getElementById('accountList');
            container.innerHTML = '';
            for (const [uid, acc] of Object.entries(accounts)) {
                const div = document.createElement('div');
                div.className = 'account';
                div.innerHTML = `
                    <strong>${acc.phone}</strong> (${acc.status})<br>
                    <button onclick="loadChats('${uid}', '${acc.phone}')">💬 View Chats</button>
                    <button onclick="sendMessageDemo('${uid}')">📤 Send Test Msg</button>
                `;
                container.appendChild(div);
            }
        }

        // Load Chats for Account
        async function loadChats(userId, phone) {
            currentUserId = userId;
            document.getElementById('currentPhone').innerText = phone;
            document.getElementById('accountList').style.display = 'none';
            document.getElementById('chatList').style.display = 'block';

            // Demo chats (in real app, fetch from Telethon)
            const chats = [
                {id: 1, name: "My Boss", lastMsg: "OK send the file"},
                {id: 2, name: "Dev Group", lastMsg: "Code deployed!"},
                {id: 3, name: "Mom", lastMsg: "Ki koro?"},
            ];

            const container = document.getElementById('chatsContainer');
            container.innerHTML = '';
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'chat';
                div.innerHTML = `<strong>${chat.name}</strong><br>${chat.lastMsg}`;
                div.onclick = () => openChat(chat.name, chat.id);
                container.appendChild(div);
            });
        }

        // Open Chat (Dummy)
        function openChat(name, chatId) {
            document.getElementById('chatList').style.display = 'none';
            document.getElementById('chatView').style.display = 'block';
            document.getElementById('chatTitle').innerText = name;

            // Dummy messages
            const msgDiv = document.getElementById('messages');
            msgDiv.innerHTML = `
                <div class="msg them">Hi, how are you?</div>
                <div class="msg you">I'm good, thanks!</div>
                <div class="msg them">Send me the report</div>
            `;
        }

        // Back Buttons
        document.getElementById('backToAccounts')?.addEventListener('click', () => {
            document.getElementById('chatList').style.display = 'none';
            document.getElementById('accountList').style.display = 'block';
        });
        document.getElementById('backToChats')?.addEventListener('click', () => {
            document.getElementById('chatView').style.display = 'none';
            document.getElementById('chatList').style.display = 'block';
        });

        // Send Message Demo
        async function sendMessageDemo(userId) {
            const res = await fetch(`/api/send_message?key=${SECRET_KEY}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    user_id: userId,
                    to: 'me',
                    message: 'Hello from Admin Panel!'
                })
            });
            const data = await res.json();
            alert(data.success ? "Message Sent!" : "Failed: " + data.error);
        }

        // Init
        loadAccounts();
    </script>
</body>
</html>
